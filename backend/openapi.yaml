  # ════════════════════════════════════════════════════════════════════
  # RECIPES
  # ════════════════════════════════════════════════════════════════════

  /receptes/:
    get:
      tags: [Recipes]
      summary: List all recipes (paginated)
      description: |
        Returns a paginated list of recipe summaries. Supports filtering and `LimitOffsetPagination`
        (default limit: 500, max: 500).
      parameters:
        - name: dieta
          in: query
          description: Filter recipes that contain this diet label (e.g. `vegà`, `vegetarià`).
          schema:
            type: string
            example: vegà
        - name: max_temps
          in: query
          description: Filter recipes with preparation time ≤ this value (minutes).
          schema:
            type: integer
            example: 30
        - name: producte
          in: query
          description: Filter recipes that include a specific product ID as an ingredient.
          schema:
            type: integer
            example: 5
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of recipe summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecipeSummary'
        '400':
          description: Invalid query parameter (e.g. non-integer `max_temps` or `producte`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid access token

  /receptes/{id}/:
    get:
      tags: [Recipes]
      summary: Retrieve a recipe by Spoonacular ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "716429"
      responses:
        '200':
          description: Full recipe detail including ingredients and instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '401':
          description: Missing or invalid access token
        '404':
          description: Not found

