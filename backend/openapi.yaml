  # ════════════════════════════════════════════════════════════════════
  # RECOMMENDATIONS
  # ════════════════════════════════════════════════════════════════════

  /recomanacions/:
    get:
      tags: [Recommendations]
      summary: Get recipe recommendations based on inventory
      description: |
        Scores all recipes in the database against the user's current inventory and returns them
        sorted by score descending. Supports `LimitOffsetPagination` (default limit: 500, max: 500).

        **Scoring algorithm:**
        - Base score (max 0.85): fraction of recipe ingredients present in the inventory.
        - Urgency bonus (max 0.15): applied when one or more inventory ingredients are expiring within `dies_avis_caducitat` days. The closer to expiry, the higher the bonus.
        - Final score is capped at 1.0.

        Recipes with no linked ingredients are excluded from results.
      parameters:
        - name: dieta
          in: query
          description: Include only recipes with this diet label.
          schema:
            type: string
            example: vegà
        - name: max_temps
          in: query
          description: Include only recipes with preparation time ≤ this value (minutes).
          schema:
            type: integer
            example: 30
        - name: nomes_inventari
          in: query
          description: If `true`, return only recipes where **all** ingredients are in the inventory.
          schema:
            type: boolean
            default: false
            example: true
        - name: nomes_urgents
          in: query
          description: |
            If `true`, return only recipes that use at least one inventory item expiring within
            `dies_avis_caducitat` days.
          schema:
            type: boolean
            default: false
            example: true
        - name: productes
          in: query
          description: |
            Comma-separated list of product IDs. Restricts the inventory snapshot to only
            these products when computing scores (useful for "what can I make with these items?").
          schema:
            type: string
            example: "5,12,34"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of scored recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecommendation'
        '400':
          description: Invalid query parameter (e.g. non-integer `max_temps` or non-integer values in `productes`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid access token
